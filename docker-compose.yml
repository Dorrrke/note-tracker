version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: note_tracker
    ports:
      - "5432:5432"
    networks:
      - app-network

  pgadmin:
      image: dpage/pgadmin4:7.2
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@example.com
        PGADMIN_DEFAULT_PASSWORD: adminpassword
      ports:
        - "5050:80"
      depends_on:
        - db
      networks:
        - app-network
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # - MIGRATE_PATH=migrations
      - DBDSN=postgres://user:password@localhost:5432/note_tracker?sslmode=disable
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge